# Self-hosted Langfuse (v2 line) — single web container + Postgres.
# Chosen over the v3 microservice stack (clickhouse/redis/minio/worker) to
# stay light on a 16GB Mac that also runs Ollama models. Traces never leave
# this machine. UI: http://localhost:3001
#
# The backend picks up keys from LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY /
# LANGFUSE_HOST (see backend/app/observability.py). Create keys in the UI:
# sign up -> Settings -> API Keys, then export them before starting uvicorn.

services:
  langfuse-db:
    image: postgres:16-alpine
    container_name: langfuse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 3s
      timeout: 3s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2
    container_name: langfuse
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: langfuse-local-dev-secret-change-me
      SALT: langfuse-local-dev-salt-change-me
      TELEMETRY_ENABLED: "false"
      # No SMTP in local mode — first signup is open on localhost only.

volumes:
  langfuse-pgdata:
