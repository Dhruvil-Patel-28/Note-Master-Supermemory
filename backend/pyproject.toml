[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "docling>=2.121.0",
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "langfuse>=2,<3",
    "ollama>=0.6.2",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.2",
    "pypdf>=6.15.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "llm: runs real Ollama inference (chat answers, intent, note facts) — needs Ollama up and the configured models pulled",
    "memory: runs the live e2e battery against the local supermemory-server — run ONLY via scripts/run-memory-tests.sh (isolated nm_test container)",
    "retrieval: retrieval-quality battery against the live user_main store (context assembly only, no model answers) — run via scripts/run-retrieval-tests.sh",
]
